# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: asaanhire-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false            # you paste this in the dashboard; never committed
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        sync: false            # your Vercel URL, e.g. https://asaanhire.vercel.app
      # - key: DATABASE_URL    # optional: free Postgres (Neon) so accounts survive restarts
      #   sync: false
